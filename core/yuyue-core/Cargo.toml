[package]
name = "yuyue-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# lib: CLI and tests; staticlib: Apple (XCFramework); cdylib: Android (JNI) and Swift binding generation.
crate-type = ["lib", "staticlib", "cdylib"]
name = "yuyue_core"

[dependencies]
base64 = "0.22"
blake3 = "1.8.7"
# 反馈: libsodium sealed box (crypto_box_seal). Same bytes PyNaCl opens.
crypto_box = { version = "0.9.1", features = ["seal"] }
chardetng = "1.0.0"
encoding_rs = "0.8.42"
getrandom = "0.4.3"
# markup5ever_rcdom 0.39 needs html5ever 0.39; keep them in step.
html5ever = "0.39"
markup5ever_rcdom = "0.39.0"
icu_segmenter = "2.3.0"
percent-encoding = "2.3.2"
# 读音: each character's readings (MIT); data/pinyin-phrases.txt says which a phrase takes.
pinyin = { version = "0.11.0", default-features = false, features = ["plain", "with_tone_num_end", "heteronym"] }
regex = "1.13.1"
roxmltree = "0.21.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uniffi = "0.32.2"
# MDict 词典 (.mdx): zlib and LZO blocks, the key index's RIPEMD-128 obfuscation.
flate2 = "1.1.10"
rust-lzo1x = "0.4.0"
ripemd = "0.1.3"
# 简繁转换 for a book, pure Rust (OpenCC and MediaWiki tables).
zhconv = { version = "0.4.2", default-features = false, features = ["compress", "opencc-hans", "opencc-hant"] }
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

