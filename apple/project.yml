# The Xcode project is generated from this file: `cd apple && xcodegen`.
# Build the core first: `apple/build-core.sh`. The reader bundle comes from `reader/dist`
# (`cd reader && pnpm build`).
name: Yuyue
options:
  bundleIdPrefix: app.yuyue
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  YuyueCore:
    path: YuyueCore

settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    # 英文界面: every Chinese string is a key in Yuyue/Localizable.xcstrings.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # 关于 里那个"阅"字标：AppIcon 由脚本按同一套比例生成（见 docs/dev/app-icon.md）。
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  Yuyue:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Yuyue
        excludes:
          - "**/.DS_Store"
      # Served to the WebView as /app/… (docs/dev/reader-contract.md §1).
      - path: ../reader/dist
        type: folder
        buildPhase: resources
      # Wi‑Fi 传书's page for the computer, shared with Android.
      - path: ../shared/wifi-page.html
        buildPhase: resources
    dependencies:
      - package: YuyueCore
    scheme: {}
    info:
      path: Yuyue/Info.plist
      properties:
        CFBundleDisplayName: 语阅
        CFBundleName: 语阅
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.books
        # 同步 · Google Drive: the iOS OAuth client of 语阅's Google Cloud project, once registered.
        YYGoogleClientID: $(GOOGLE_CLIENT_ID)
        # 反馈: empty until Feedback.local.xcconfig fills them in. Not committed.
        YuyueFeedbackTopic: $(YUYUE_FEEDBACK_TOPIC)
        YuyueFeedbackPublicKey: $(YUYUE_FEEDBACK_PUBLIC_KEY)
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Opened files are read where they are (security-scoped) and copied into the library.
        LSSupportsOpeningDocumentsInPlace: true
        # 数据快照 are kept in Documents, which 文件 shows as 语阅.
        UIFileSharingEnabled: true
        # Wi‑Fi 传书: a computer's browser on the same Wi‑Fi sends books to the phone.
        # 远程书库 at home are plain http on a local address.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 电脑浏览器给语阅传书时，要经过你的 Wi‑Fi 连到这台设备。
        # 克隆声音: a short recording of the user reading, sent to their own ElevenLabs account.
        NSMicrophoneUsageDescription: 克隆声音时，录一小段你念书的声音。录音存在这台设备上，克隆时会传到你在设置里接的 ElevenLabs 账号。
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
          - CFBundleTypeName: Text
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Kindle 电子书
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [app.yuyue.mobi, app.yuyue.azw3]
          - CFBundleTypeName: 有声书
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
          - CFBundleTypeName: 语阅快照
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [app.yuyue.snapshot]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.yuyue.snapshot
            UTTypeDescription: 语阅快照
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [yuyue]
        UTImportedTypeDeclarations:
          # Kindle books: an old MOBI (also .azw, .prc), or KF8 (.azw3).
          - UTTypeIdentifier: app.yuyue.mobi
            UTTypeDescription: Kindle 电子书
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [mobi, azw, prc]
          - UTTypeIdentifier: app.yuyue.azw3
            UTTypeDescription: Kindle 电子书
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [azw3]
    configFiles:
      Debug: Config/Feedback.xcconfig
      Release: Config/Feedback.xcconfig
    settings:
      base:
        PRODUCT_NAME: Yuyue
        # Placeholder until the App Store identity is settled.
        PRODUCT_BUNDLE_IDENTIFIER: app.yuyue.Yuyue
        # Empty until 语阅 is registered with Google; 同步 · Google Drive waits for it.
        GOOGLE_CLIENT_ID: ""
        # Overridden by apple/Config/Feedback.local.xcconfig when it exists.
        YUYUE_FEEDBACK_TOPIC: ""
        YUYUE_FEEDBACK_PUBLIC_KEY: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Yuyue/Yuyue.entitlements
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
